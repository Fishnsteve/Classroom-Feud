    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        overflow: hidden;
      }
      .font-title {
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .perspective-container {
        perspective: 1500px;
      }
      .flip-card-inner {
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
      }
      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front, .flip-card-back {
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      .flip-card-back {
        transform: rotateY(180deg);
      }
      
      .glass-card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      @keyframes neon-pulse {
        0%, 100% { box-shadow: 0 0 10px rgba(0, 242, 255, 0.2), inset 0 0 5px rgba(0, 242, 255, 0.1); }
        50% { box-shadow: 0 0 25px rgba(0, 242, 255, 0.4), inset 0 0 15px rgba(0, 242, 255, 0.2); }
      }
      .neon-glow {
        animation: neon-pulse 3s infinite;
      }

      @keyframes strike-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #ef4444); opacity: 1; }
        50% { transform: scale(1.2); filter: drop-shadow(0 0 20px #ef4444); opacity: 0.8; }
      }
      .animate-strike-pulse {
        animation: strike-pulse 0.6s ease-out;
      }
    </style>
